<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Dark tile so the mark reads on both light browser tabs and the black site -->
  <rect width="100" height="100" rx="24" fill="#0b0b0d"/>
  <rect x="0.5" y="0.5" width="99" height="99" rx="23.5" fill="none" stroke="#ffffff" stroke-opacity="0.12"/>
  <!-- The Deathly Hallows: cloak (triangle), stone (circle), wand (line) -->
  <g fill="none" stroke="#f5f5f7" stroke-width="6" stroke-linecap="round" stroke-linejoin="round">
    <path d="M50 14 L88 90 L12 90 Z"/>
    <circle cx="50" cy="60" r="21"/>
    <line x1="50" y1="14" x2="50" y2="90"/>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Dark tile so the mark reads on both light browser tabs and the black site -->
  <rect width="100" height="100" rx="24" fill="#0b0b0d"/>
  <rect x="0.5" y="0.5" width="99" height="99" rx="23.5" fill="none" stroke="#ffffff" stroke-opacity="0.12"/>
  <!-- Triquetra: three inward-bulging arcs crossing into a central triangle -->
  <path
    d="M 50 20
       A 31.5 31.5 0 0 1 20.56 71
       A 31.5 31.5 0 0 1 79.44 71
       A 31.5 31.5 0 0 1 50 20"
    fill="none" stroke="#f5f5f7" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
